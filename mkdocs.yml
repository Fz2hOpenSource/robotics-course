site_name: Fz2hOpenSource Robotics Course
site_url: https://Fz2hOpenSource.github.io/robotics-course/
repo_url: https://github.com/Fz2hOpenSource/robotics-course
repo_name: Fz2hOpenSource/robotics-course

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: dark    
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan    
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.view
    - content.action.edit
  
  font:
    text: Roboto
    code: Roboto Mono
  
  logo: image/LOGO.jpg
  favicon: image/LOGO.jpg
  icon:
    repo: fontawesome/brands/github


plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true        
        - locale: zh
          name: 简体中文
          build: true


extra:
  analytics:
    provider: google
    property: G-L8NRTF0T7G
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Fz2hOpenSource
  alternate:
    - name: 简体中文
      link: ./zh/
      lang: zh
    - name: English
      link: ./
      lang: en
  # MathJax Configuration
  mathjax:
    version: 3.2.2
    annotator: false
    config:
      tex:
        inlineMath:
          - ['$', '$']
          - ['\\(', '\\)']
        displayMath:
          - ['$$', '$$']
          - ['\\[', '\\]']
        processEscapes: true
        processEnvironments: true
      options:
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      startup:
        ready: null


markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


