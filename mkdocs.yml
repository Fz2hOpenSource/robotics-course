site_name: Fz2hOpenSource Robotics Course
site_url: https://Fz2hOpenSource.github.io/robotics-course/
repo_url: https://github.com/Fz2hOpenSource/robotics-course
repo_name: Fz2hOpenSource/robotics-course

theme:
  name: material  # 使用 Material 主题
  language: en  # 设置界面语言为简体中文
  
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: dark    
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan    
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:  # 功能特性配置
    - navigation.tabs  # 启用顶部导航标签页
    - navigation.sections  # 启用侧边栏分组
    - navigation.expand  # 默认展开所有导航项
    - navigation.top  # 显示"返回顶部"按钮
    - navigation.tracking  # 地址栏自动更新当前标题的锚点
    - search.suggest  # 搜索建议
    - search.highlight  # 搜索结果高亮
    - content.code.copy  # 代码块添加复制按钮
  
  font:  # 字体配置
    text: Roboto  # 正文字体
    code: Roboto Mono  # 代码字体（等宽）
  
  # Logo 和图标配置
  logo: image/LOGO.jpg  # 网站 Logo 路径
  favicon: image/LOGO.jpg  # 浏览器标签页图标
  icon:
    repo: fontawesome/brands/github  # 仓库图标（显示 GitHub 图标）


# Plugins
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true        
        - locale: zh
          name: 简体中文
          build: true


# Extra configuration (Language Switcher)
extra:
  analytics:
    provider: google
    property: G-L8NRTF0T7G
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourname
  alternate:
    - name: 简体中文
      link: ./zh/
      lang: zh
    - name: English
      link: ./
      lang: en


# Markdown Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation (Example Structure - will be auto-generated or manually specified)
nav:
  - Home: index.md
  - Preliminary:
      - Python Environment: Preliminary/Environment_setup.md  
      - Linux: Preliminary/Linux.md
  - ROS:
      - Introduction: ros/index.md
      - Setup Robot Environment: ros/setup_robot_env.md
      - ROS Communication: ros/ros_communication_demo.md
      - ROS Perception module: ros/perception_node.md
  - Perception:
      - Overview: perception/index.md
      - YOLO: perception/yolo.md
      - Training: perception/training.md
  # - Path Planning:
  #     - Basics: planning/index.md
  #     - Algorithms: planning/algorithms.md
