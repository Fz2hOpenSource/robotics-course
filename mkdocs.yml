site_name: Fz2hOpenSource Robotics Course
site_url: https://Fz2hOpenSource.github.io/robotics-course/
repo_url: https://github.com/Fz2hOpenSource/robotics-course
repo_name: Fz2hOpenSource/robotics-course

theme:
  name: material
  language: zh # 简体中文 # en # English
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
  font:
    text: Roboto
    code: Roboto Mono
  # Logo and favicon
  icon:
    logo: material/robot
    repo: fontawesome/brands/github

# Plugins
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true

# Extra configuration (Language Switcher)
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourname
  alternate:
    - name: 简体中文
      link: /robotics-course/zh/
      lang: zh
    - name: English
      link: /robotics-course/
      lang: en


# Markdown Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Navigation (Example Structure - will be auto-generated or manually specified)
nav:
  - Home: index.md
  - ROS:
      - Introduction: ros/index.md
      - Installation: ros/installation.md
      - Topics & Nodes: ros/topics.md
  - YOLO:
      - Overview: yolo/index.md
      - Training: yolo/training.md
  - Path Planning:
      - Basics: planning/index.md
      - Algorithms: planning/algorithms.md
